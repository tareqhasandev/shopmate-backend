name: Backend checks

on:
  push:
    branches:
      - shopmate-render-deploy

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://shopmate:shopmate@127.0.0.1:5432/shopmate?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Typecheck and validate Prisma schema
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --testPathIgnorePatterns=products.integration.spec.ts
